; PHP's initialization file, php.ini
; Documentation: https://www.php.net/manual/en/ini.php

;;;;;;;;;;;;;;;;;;;
; General Settings ;
;;;;;;;;;;;;;;;;;;;

[PHP]
; Language Options
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
serialize_precision = 17
zend.enable_gc = On
expose_php = On
max_execution_time = 30
max_input_time = 60
memory_limit = 128M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
post_max_size = 8M
upload_max_filesize = 2M
max_file_uploads = 20
default_socket_timeout = 60

;;;;;;;;;;;;;;;;;;;
; Date and Time ;
;;;;;;;;;;;;;;;;;;;

[Date]
; Set your timezone here
date.timezone = Asia/Jakarta

;;;;;;;;;;;;;;;;;;;;;;
; Dynamic Extensions ;
;;;;;;;;;;;;;;;;;;;;;;

[Extension]
; Extensions to load (Unix/Linux format)
extension=curl
extension=mbstring
extension=mysqli
extension=pdo
extension=pdo_mysql
extension=json
extension=gd

;;;;;;;;;;;;;;;;;;;;;;;;;;
; File Uploads Settings ;
;;;;;;;;;;;;;;;;;;;;;;;;;;

[File Uploads]
file_uploads = On
upload_tmp_dir = /tmp
upload_max_filesize = 2M
max_file_uploads = 20

;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Resource Limits Settings ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[Resource Limits]
max_execution_time = 30
max_input_time = 60
memory_limit = 128M

;;;;;;;;;;;;;;;;;;;;;;;;;
; Session Settings ;
;;;;;;;;;;;;;;;;;;;;;;;;;

[Session]
session.save_handler = files
session.save_path = "/var/lib/php/sessions"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_lifetime = 0
session.gc_maxlifetime = 1440
session.gc_probability = 1
session.gc_divisor = 1000

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Error Handling and Logging ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[Error Handling]
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

;;;;;;;;;;;;;;;;;;;
; Mail Settings ;
;;;;;;;;;;;;;;;;;;;

[mail function]
; For Unix systems, this will be the sendmail binary path
sendmail_path = /usr/sbin/sendmail -t -i
SMTP = localhost
smtp_port = 25

;;;;;;;;;;;;;;;;;;;;
; Miscellaneous ;
;;;;;;;;;;;;;;;;;;;;

; Realpath cache size
realpath_cache_size = 16k
realpath_cache_ttl = 120
