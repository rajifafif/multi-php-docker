
# Custom network for better container communication
networks:
  app-network:
    driver: bridge

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ~/www/html:/var/www/html:cached
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      php56:
        condition: service_healthy
      php74:
        condition: service_healthy
      php81:
        condition: service_healthy
      php82:
        condition: service_healthy
      php84:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  php56:
    image: php:5.6-fpm-alpine
    container_name: php56-fpm
    ports:
      - "9056:9000"
    volumes:
      - ~/www/html:/var/www/html:cached
      - ./php-sessions:/var/lib/php/sessions:rw
      - ./php5.6.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./logs/php:/var/log:rw
    environment:
      - PHP_IDE_CONFIG=serverName=docker-php56
      - COMPOSER_ALLOW_SUPERUSER=1
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  php74:
    image: php:7.4-fpm
    container_name: php74-fpm
    ports:
      - "9074:9000"
    volumes:
      - ~/www/html:/var/www/html:cached
      - ./php-sessions:/var/lib/php/sessions:rw
      - ./php74.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./php-fpm74.conf:/usr/local/etc/php-fpm.d/zzz-custom.conf:ro
      - ./logs/php:/var/log:rw
    environment:
      - PHP_IDE_CONFIG=serverName=docker-php74
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - COMPOSER_ALLOW_SUPERUSER=1
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  php81:
    image: php:8.1-fpm
    container_name: php81-fpm
    ports:
      - "9081:9000"
    volumes:
      - ~/www/html:/var/www/html:cached
      - ./php-sessions:/var/lib/php/sessions:rw
      - ./php81.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./php-fpm81.conf:/usr/local/etc/php-fpm.d/zzz-custom.conf:ro
      - ./logs/php:/var/log:rw
    environment:
      - PHP_IDE_CONFIG=serverName=docker-php81
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - COMPOSER_ALLOW_SUPERUSER=1
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  php82:
    image: php:8.2-fpm
    container_name: php82-fpm
    ports:
      - "9082:9000"
    volumes:
      - ~/www/html:/var/www/html:cached
      - ./php-sessions:/var/lib/php/sessions:rw
      - ./php82.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./php-fpm82.conf:/usr/local/etc/php-fpm.d/zzz-custom.conf:ro
      - ./logs/php:/var/log:rw
    environment:
      - PHP_IDE_CONFIG=serverName=docker-php82
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - COMPOSER_ALLOW_SUPERUSER=1
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  php84:
    image: php:8.4-fpm
    container_name: php84-fpm
    ports:
      - "9084:9000"
    volumes:
      - ~/www/html:/var/www/html:cached
      - ./php-sessions:/var/lib/php/sessions:rw
      - ./php84.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./php-fpm84.conf:/usr/local/etc/php-fpm.d/zzz-custom.conf:ro
      - ./logs/php:/var/log:rw
    environment:
      - PHP_IDE_CONFIG=serverName=docker-php84
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - COMPOSER_ALLOW_SUPERUSER=1
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: phpmyadmin
    ports:
      - "6969:80"
    environment:
      PMA_HOSTS: host.docker.internal,mysql80
      PMA_ARBITRARY: 1
      PMA_USER: root
      PMA_PASSWORD: password
      UPLOAD_LIMIT: 64M
      MEMORY_LIMIT: 256M
    depends_on:
      mysql80:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  mysql80:
    image: mysql:8.0.35
    container_name: mysql80-legacy
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: test_db
      MYSQL_USER: developer
      MYSQL_PASSWORD: dev_password
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql80_data:/var/lib/mysql
      - ./mysql80-init:/docker-entrypoint-initdb.d:ro
      - ./logs/mysql80:/var/log/mysql:rw
      - ./mysql80-config:/etc/mysql/conf.d:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=512M
      --innodb-buffer-pool-instances=2
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=1
      --innodb-file-per-table=1
      --max-connections=200
      --tmp-table-size=64M
      --max-heap-table-size=64M
      --general-log=0
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=2
      --log-queries-not-using-indexes=1
      --binlog-expire-logs-seconds=604800
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - seccomp:unconfined

# Named volumes for persistent data
volumes:
  mysql80_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/mysql80
  redis_data:
    driver: local

# Connection Guide:
# 
# FROM DOCKER CONTAINERS (PHP-FPM services):
# - MySQL 8.0 (Docker): mysql80:3306
# - Redis: redis:6379
#
# FROM macOS (outside Docker):
# - MySQL 8.0 (Docker): localhost:3306
# - phpMyAdmin: localhost:6969
# - Nginx: localhost:80
#
# RECOMMENDED COMBINATIONS:
# - PHP 5.6 → MySQL 8.0 (mysql_native_password compatible)
# - PHP 7.4+ → MySQL 8.0 with better performance features
# - All PHP versions can connect to Redis for caching
