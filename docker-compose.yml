version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ~/www/html:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - php56
      - php74
      - php81
      - php82
      - php84

  php56:
    build:
      context: .
      dockerfile: Dockerfile-5.6
    ports:
      - "9056:9000"
    volumes:
      - ~/www/html:/var/www/html
      - ./php-sessions:/var/lib/php/sessions
      - ./php5.6.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./logs/php:/var/log
    environment:
      - PHP_IDE_CONFIG=serverName=docker-php56
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  php74:
    build:
      context: .
      dockerfile: Dockerfile-7.4
    ports:
      - "9074:9000"
    volumes:
      - ~/www/html:/var/www/html
      - ./php-sessions:/var/lib/php/sessions
      - ./php74.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./logs/php:/var/log
    environment:
      - PHP_IDE_CONFIG=serverName=docker-php74
      - XDEBUG_CONFIG=client_host=host.docker.internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  php81:
    build:
      context: .
      dockerfile: Dockerfile-8.1
    ports:
      - "9081:9000"
    volumes:
      - ~/www/html:/var/www/html
      - ./php-sessions:/var/lib/php/sessions
      - ./php81.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./logs/php:/var/log
    environment:
      - PHP_IDE_CONFIG=serverName=docker-php81
      - XDEBUG_CONFIG=client_host=host.docker.internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  php82:
    build:
      context: .
      dockerfile: Dockerfile-8.2
    ports:
      - "9082:9000"
    volumes:
      - ~/www/html:/var/www/html
      - ./php-sessions:/var/lib/php/sessions
      - ./php82.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./logs/php:/var/log
    environment:
      - PHP_IDE_CONFIG=serverName=docker-php82
      - XDEBUG_CONFIG=client_host=host.docker.internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  php84:
    build:
      context: .
      dockerfile: Dockerfile-8.4
    ports:
      - "9084:9000"
    volumes:
      - ~/www/html:/var/www/html
      - ./php-sessions:/var/lib/php/sessions
      - ./php84.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./logs/php:/var/log
    environment:
      - PHP_IDE_CONFIG=serverName=docker-php84
      - XDEBUG_CONFIG=client_host=host.docker.internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  phpmyadmin:
    image: arm64v8/phpmyadmin
    ports:
      - "6969:80"
    environment:
      PMA_HOSTS: host.docker.internal,mysql80
      PMA_ARBITRARY: 1
      PMA_USER: root
      PMA_PASSWORD: password
    depends_on:
      - mysql80

  mysql80:
    image: mysql:8.0
    container_name: mysql80-legacy
    ports:
      - "3307:3306"  # External access via localhost:3307, Internal access via mysql80:3306
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: test_db
      MYSQL_USER: developer
      MYSQL_PASSWORD: dev_password
    volumes:
      - mysql80_data:/var/lib/mysql
      - ./mysql80-init:/docker-entrypoint-initdb.d
      - ./logs/mysql80:/var/log/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=200
      --general-log=1
      --general-log-file=/var/log/mysql/general.log
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mysql80_data:
    driver: local

# Connection Guide:
# 
# FROM DOCKER CONTAINERS (PHP-FPM services):
# - MySQL 8.4 (Native): host.docker.internal:3306
# - MySQL 8.0 (Docker): mysql80:3306
#
# FROM macOS (outside Docker):
# - MySQL 8.4 (Native): localhost:3306  
# - MySQL 8.0 (Docker): localhost:3307
#
# RECOMMENDED COMBINATIONS:
# - PHP 5.6 → MySQL 8.0 (mysql_native_password compatible)
# - PHP 7.4+ → MySQL 8.4 (better performance, latest features)
